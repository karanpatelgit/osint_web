<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OSINT Intelligence Engine Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
/* ── Reset & Base Styles ──────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #0a0a0b;
  --bg2:       #111114;
  --bg3:       #18181d;
  --border:    #242428;
  --border2:   #2e2e35;
  --text:      #e8e8ec;
  --muted:     #6b6b78;
  --muted2:    #4a4a55;
  --accent:    #e63b3b;
  --accent2:   #ff6b6b;
  --green:     #3bca7a;
  --yellow:    #f0b429;
  --blue:      #4d9de0;
  --mono:      'Space Mono', monospace;
  --sans:      'DM Sans', sans-serif;
  --radius:    6px;
  --radius2:   10px;
}

body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.6; min-height: 100vh; }
body::before { content: ''; position: fixed; inset: 0; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px); pointer-events: none; z-index: 9999; }
.shell { max-width: 900px; margin: 0 auto; padding: 0 20px 60px; }

/* ── Header ──────────────────────────────────────────────────────────── */
header { border-bottom: 1px solid var(--border); padding: 28px 0 20px; margin-bottom: 28px; display: flex; align-items: flex-start; gap: 16px; }
.logo-mark { width: 38px; height: 38px; border: 1.5px solid var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; animation: pulse-ring 3s ease-in-out infinite; }
@keyframes pulse-ring { 0%, 100% { box-shadow: 0 0 0 0 rgba(230,59,59,0.4); } 50% { box-shadow: 0 0 0 8px rgba(230,59,59,0); } }
.logo-mark svg { width: 18px; height: 18px; stroke: var(--accent); fill: none; }
.header-text h1 { font-family: var(--mono); font-size: 15px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.header-text p { font-size: 12px; color: var(--muted); margin-top: 3px; font-family: var(--mono); }
.header-badge { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--accent); border: 1px solid var(--accent); padding: 3px 10px; border-radius: 2px; text-transform: uppercase; }

/* ── Panel Components ────────────────────────────────────────────────── */
.panel { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius2); padding: 18px; margin-bottom: 14px; }
.panel-label { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.panel-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

.search-wrap { display: flex; gap: 8px; margin-bottom: 12px; }
input[type="text"], select { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-size: 14px; padding: 10px 13px; outline: none; }
.search-input { flex: 1; }

.btn { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-family: var(--mono); font-size: 12px; padding: 10px 18px; cursor: pointer; white-space: nowrap; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; }

.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { font-family: var(--mono); font-size: 10px; text-transform: uppercase; border: 1px solid var(--border); border-radius: 2px; padding: 4px 10px; cursor: pointer; color: var(--muted); background: transparent; }
.chip.active { color: var(--accent); border-color: var(--accent); background: rgba(230,59,59,.06); }

/* ── Status Bar ──────────────────────────────────────────────────────── */
#statusBar { font-family: var(--mono); font-size: 11px; color: var(--muted); padding: 10px 0 4px; display: flex; align-items: center; gap: 8px; min-height: 32px; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted2); }
.dot.red   { background: var(--accent); animation: blink 1s step-end infinite; }
.dot.green { background: var(--green); }
.dot.yellow{ background: var(--yellow); animation: blink .7s step-end infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* ── Tabs & View Panes ───────────────────────────────────────────────── */
.tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
.tab { font-family: var(--mono); font-size: 11px; text-transform: uppercase; padding: 8px 16px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-pane { display: none; }
.tab-pane.visible { display: block; }

/* ── Briefing Cards ───────────────────────────────────────────────────── */
.sec { border: 1px solid var(--border); border-radius: var(--radius2); margin-bottom: 12px; overflow: hidden; }
.sec-head { display: flex; align-items: center; gap: 10px; padding: 11px 16px; background: var(--bg2); border-bottom: 1px solid var(--border); }
.sec-num { font-family: var(--mono); font-size: 10px; color: var(--muted2); }
.sec-title { font-family: var(--mono); font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text); flex: 1; }
.conf { font-family: var(--mono); font-size: 9px; padding: 2px 7px; border-radius: 2px; text-transform: uppercase; }
.conf-high   { background: rgba(59,202,122,.12); color: var(--green); }
.conf-medium { background: rgba(240,180,41,.1);  color: var(--yellow); }
.conf-low    { background: rgba(230,59,59,.1);   color: var(--accent); }

.bullet { display: flex; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--border); color: #ccc; font-size: 13.5px; }
.bullet-arrow { color: var(--accent); font-family: var(--mono); font-size: 11px; margin-top: 3px; }
.cite { font-family: var(--mono); font-size: 10px; background: rgba(77,157,224,.12); color: var(--blue); border-radius: 2px; padding: 0 5px; margin-left: 4px; text-decoration: none; border: 1px solid rgba(77,157,224,.2); display: inline-block; }

.warn-box { background: rgba(240,180,41,.06); border: 1px solid rgba(240,180,41,.2); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 12px; }
.warn-title { font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--yellow); margin-bottom: 8px; }
.warn-item { font-size: 13px; color: #c8a840; padding: 3px 0 3px 14px; position: relative; }
.warn-item::before { content: '⚠'; position: absolute; left: 0; font-size: 10px; }

.source-row { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.src-idx { font-family: var(--mono); font-size: 11px; color: var(--muted2); min-width: 80px; }
.src-url { font-family: var(--mono); font-size: 11px; color: var(--blue); cursor: pointer; display: block; word-break: break-all; margin-top: 4px; }

.quote-card { border-left: 2px solid var(--blue); background: var(--bg2); padding: 10px 16px; margin-bottom: 10px; }
.quote-text { font-size: 14px; font-style: italic; color: var(--text); }
.quote-meta { font-size: 12px; color: var(--muted); margin-top: 6px; }

.result-topbar { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 16px; }
.export-menu { display: flex; gap: 6px; }
.error-box { background: rgba(230,59,59,.08); border: 1px solid rgba(230,59,59,.25); border-radius: var(--radius); padding: 16px; font-family: var(--mono); color: var(--accent2); }
</style>
</head>
<body>
<div class="shell">

  <header>
    <div class="logo-mark">
      <svg viewBox="0 0 24 24" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/></svg>
    </div>
    <div class="header-text">
      <h1>OSINT Multi-Pass Factory</h1>
      <p>Unified Cloud Host Interface Terminal · Autonomous Deep-Web Ingestion Hub</p>
    </div>
    <div class="header-badge">Cloud Live</div>
  </header>

  <div class="panel">
    <div class="panel-label">Investigative Context Parameter Entry</div>
    <div class="search-wrap">
      <input type="text" id="targetInput" class="search-input" placeholder="Type a corporate keyword, target entity name, or complete research question..." />
      <button class="btn btn-primary" id="runBtn" onclick="dispatchDeepResearch()">LAUNCH OSINT SCANNERS</button>
    </div>

    <div class="row">
      <span style="font-family:var(--mono);font-size:10px;color:var(--muted2);">ANALYTICAL MODIFIER VECTOR:</span>
      <button class="chip active" data-angle="all" onclick="setChip(this)">Exhaustive Profile Overview</button>
      <button class="chip" data-angle="financial" onclick="setChip(this)">Scandals & Controversies Focus</button>
      <button class="chip" data-angle="networks" onclick="setChip(this)">Hidden Affiliations & Asset Trails</button>
    </div>
  </div>

  <div id="statusBar"><div class="dot"></div><span>Ready — Unified cloud infrastructure standing by for deployment queries.</span></div>
  <div id="results"></div>

</div>

<script>
// ── Production Self-Sensing Relative Routes Configuration ─────────────────────
const INITIALIZE_URL = "/api/v1/analyze";
const MONITOR_URL    = "/api/v1/status/";

let selectedAngle = 'all';
let dataBriefingCache = null;
let statusIntervalLoop = null;

function setChip(el) {
  el.closest('.row').querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  selectedAngle = el.dataset.angle;
}

function setStatus(msg, state='idle') {
  const bar = document.getElementById('statusBar');
  const colors = { idle:'', loading:'yellow', ok:'green', err:'red' };
  bar.innerHTML = `<div class="dot ${colors[state]}"></div><span>${msg}</span>`;
}

async function dispatchDeepResearch() {
  const target = document.getElementById('targetInput').value.trim();
  if (!target) { setStatus("An investigative keyword profile is mandatory.", "err"); return; }

  document.getElementById('results').innerHTML = '';
  document.getElementById('runBtn').disabled = true;
  setStatus("Enqueuing research token down into cloud background workers...", "loading");

  try {
    const initResponse = await fetch(INITIALIZE_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ target: target, angle: selectedAngle })
    });

    if (!initResponse.ok) throw new Error(`App Server returned crash status code: ${initResponse.status}`);
    const initResult = await initResponse.json();
    
    trackPipelineProgress(initResult.job_id, target);

  } catch (err) {
    setStatus("Connection Interrupted", "err");
    document.getElementById('results').innerHTML = `<div class="error-box">CRITICAL CONNECTION FAULT: Cloud terminal synchronization anomaly. Stack log trace: ${err.message}</div>`;
    document.getElementById('runBtn').disabled = false;
  }
}

function trackPipelineProgress(jobId, targetName) {
  if (statusIntervalLoop) clearInterval(statusIntervalLoop);

  statusIntervalLoop = setInterval(async () => {
    try {
      const response = await fetch(`${MONITOR_URL}${jobId}`);
      if (!response.ok) throw new Error("Status registry cloud sync dropped.");
      const jobState = await response.json();

      if (jobState.status === "queued") {
        setStatus("Job allocated inside background container app execution queues...", "loading");
      } else if (jobState.status === "ingesting_data") {
        setStatus("Deep Scrapers Active: Crawling media outlets, press releases, and legal logs...", "loading");
      } else if (jobState.status === "ai_generation") {
        setStatus("Data harvested. Processing intelligence maps via LLAMA 3.3 clusters...", "loading");
      } else if (jobState.status === "completed") {
        clearInterval(statusIntervalLoop);
        setStatus("Dossier compiled successfully with live citations.", "ok");
        
        dataBriefingCache = jobState.data;
        renderInterfaceDashboard(targetName, dataBriefingCache);
        document.getElementById('runBtn').disabled = false;
      } else if (jobState.status === "failed") {
        clearInterval(statusIntervalLoop);
        throw new Error(jobState.data?.error || "Pipeline cloud configuration exception trace.");
      }
    } catch (e) {
      clearInterval(statusIntervalLoop);
      setStatus("Pipeline Crash", "err");
      document.getElementById('results').innerHTML = `<div class="error-box">PIPELINE TASK TERMINATED: ${e.message}</div>`;
      document.getElementById('runBtn').disabled = false;
    }
  }, 2000);
}

function renderInterfaceDashboard(targetName, payload) {
  const sources = payload.sources || [];
  const srcMap = Object.fromEntries(sources.map(s => [s.index, s]));
  const conf = payload.confidence || {};

  function linkBullets(arr) {
    if (!arr?.length) return `<div class="bullet"><span class="bullet-arrow">▸</span><span>No baseline context records logged for this node space.</span></div>`;
    return arr.map(text => {
      const linkedOutput = text.replace(/\[Source (\d+)\]/g, (_, idx) => {
        const linkNode = srcMap[+idx];
        return `<a class="cite" href="${linkNode?.url || '#'}" target="_blank">[Source ${idx}]</a>`;
      });
      return `<div class="bullet"><span class="bullet-arrow">▸</span><span>${linkedOutput}</span></div>`;
    }).join('');
  }

  let tabsMarkup = `
    <div class="tabs">
      <div class="tab active" onclick="toggleActivePane('briefing',this)">Dossier Layout Matrix</div>
      <div class="tab" onclick="toggleActivePane('quotes',this)">Verbatim Statements (${payload.quotes?.length || 0})</div>
      <div class="tab" onclick="toggleActivePane('sources',this)">Verified Reference Links (${sources.length})</div>
    </div>`;

  let briefingPane = `<div id="tab-briefing" class="tab-pane visible">`;
  const blueprints = [
    { num:'01', key:'context', title:'Historical Background & Identity Timelines' },
    { num:'02', key:'network', title:'Human Networks, Founders & Affiliations' },
    { num:'03', key:'trail',   title:'Asset Tracking, Money & Paper Trails' },
    { num:'04', key:'guns',    title:'Scandals, Criticisms & Controversies (Smoking Guns)' }
  ];

  blueprints.forEach(card => {
    const scale = conf[card.key] || 'medium';
    briefingPane += `
      <div class="sec">
        <div class="sec-head">
          <span class="sec-num">${card.num}</span><span class="sec-title">${card.title}</span>
          <span class="conf conf-${scale}">${scale} Verification Confidence</span>
        </div>
        <div class="sec-body">${linkBullets(payload[card.key])}</div>
      </div>`;
  });

  if (payload.needs_corroboration?.length) {
    briefingPane += `<div class="warn-box"><div class="warn-title">⚠ PRE-PUBLICATION SPIN CHECK AND CORROBORATION CRITERIA</div>`;
    payload.needs_corroboration.forEach(item => briefingPane += `<div class="warn-item">${item}</div>`);
    briefingPane += `</div>`;
  }
  briefingPane += `</div>`;

  let quotesPane = `<div id="tab-quotes" class="tab-pane">`;
  if (payload.quotes?.length) {
    payload.quotes.forEach(q => {
      quotesPane += `<div class="quote-card"><div class="quote-text">"${q.quote}"</div><div class="quote-meta">── **${q.speaker}** ${q.source_url ? `· <a href="${q.source_url}" target="_blank" style="color:var(--blue)">Source Link</a>` : ''}</div></div>`;
    });
  } else { quotesPane += `<p style="color:var(--muted);padding:12px;">Zero verified raw statements extracted across content nodes.</p>`; }
  quotesPane += `</div>`;

  let sourcesPane = `<div id="tab-sources" class="tab-pane">`;
  if (sources.length) {
    sources.forEach(s => {
      sourcesPane += `
        <div class="source-row">
          <span class="src-idx">[Source ${s.index}]</span>
          <div style="flex:1">
            <strong style="color:var(--text); font-size:13px;">${s.title || s.domain}</strong>
            <span class="src-url" onclick="window.open('${s.url}','_blank')">${s.url}</span>
          </div>
        </div>`;
    });
  } else { sourcesPane += `<p style="color:var(--muted);padding:12px;">No source lookup data logged.</p>`; }
  sourcesPane += `</div>`;

  document.getElementById('results').innerHTML = `
    <div class="result-topbar">
      <div><div class="entity-header">${targetName}</div><div class="entity-meta">Automated Verification Profile Timestamp: ${new Date().toLocaleDateString()}</div></div>
      <div class="export-menu">
        <button class="copy-btn" onclick="saveDataPackage('md','${targetName}')">DOWNLOAD COMPASS REPORT .MD</button>
        <button class="copy-btn" onclick="saveDataPackage('json','${targetName}')">DOWNLOAD DATA STRUCTURE .JSON</button>
      </div>
    </div>
    ${tabsMarkup}${briefingPane}${quotesPane}${sourcesPane}`;
}

function toggleActivePane(name, component) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('visible'));
  component.classList.add('active');
  document.getElementById('tab-' + name).classList.add('visible');
}

function saveDataPackage(extension, titleString) {
  if (!dataBriefingCache) return;
  let textBuffer = ""; let dataMime = "text/plain";

  if (extension === 'json') {
    textBuffer = JSON.stringify(dataBriefingCache, null, 2); dataMime = "application/json";
  } else if (extension === 'md') {
    dataMime = "text/markdown";
    textBuffer = `# AUTOMATED DEEP-OSINT EXTRACTION REPORT: ${titleString.toUpperCase()}\n\n*Generated via Multi-Pass Factory Environment on ${new Date().toDateString()}*\n\n---\n\n`;
    
    const categories = [
      { h: "1. Identity Background & Historical Timelines", k: "context" },
      { h: "2. Human Networks, Founders & Strategic Alliances", k: "network" },
      { h: "3. Asset Registries & Asset Flows", k: "trail" },
      { h: "4. Scandals, Criticisms & Discrepancies (Smoking Guns)", k: "guns" }
    ];

    categories.forEach(node => {
      textBuffer += `## ${node.h}\n`;
      (dataBriefingCache[node.k] || []).forEach(bullet => textBuffer += `- ${bullet}\n`);
      textBuffer += `\n`;
    });

    textBuffer += `## 5. Audit References & Verified Source Links\n`;
    (dataBriefingCache.sources || []).forEach(s => textBuffer += `- **[Source ${s.index}]** ${s.title || s.domain} ── ${s.url}\n`);
  }

  const outputBlob = new Blob([textBuffer], { type: dataMime });
  const virtualAnchor = document.createElement('a');
  virtualAnchor.href = URL.createObjectURL(outputBlob);
  virtualAnchor.download = `OSINT_Dossier_${titleString.replace(/\s+/g, '_')}.${extension}`;
  document.body.appendChild(virtualAnchor); virtualAnchor.click(); document.body.removeChild(virtualAnchor);
}

document.getElementById('targetInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') dispatchDeepResearch();
});
</script>
</body>
</html>
