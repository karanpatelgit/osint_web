name: Deploy OSINT Engine to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:  # manual trigger from GitHub UI

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Inject API keys from GitHub Secrets into index.html at build time
      - name: Inject API keys into HTML
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          sed -i "s|__GROQ_API_KEY__|${GROQ_API_KEY}|g" index.html
          sed -i "s|__GEMINI_API_KEY__|${GEMINI_API_KEY}|g" index.html
          sed -i "s|__ANTHROPIC_API_KEY__|${ANTHROPIC_API_KEY}|g" index.html
          sed -i "s|__OPENAI_API_KEY__|${OPENAI_API_KEY}|g" index.html
          echo "Keys injected successfully"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'   # upload entire repo root as the site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
