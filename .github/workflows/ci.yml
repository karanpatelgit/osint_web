name: OSINT Autonomous Research Loop

on:
  repository_dispatch:
    types: [trigger-research]
  workflow_dispatch:
    inputs:
      target:
        description: 'Investigative Keyword / Topic / Question'
        required: true
        type: string
      provider:
        description: 'AI Processing Engine'
        required: true
        default: 'groq'
        type: choice
        options:
          - groq
          - gemini

permissions:
  contents: write # Grants the runner clearance to write data back to your repository

jobs:
  investigate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    - name: Set Up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 duckduckgo-search openai google-generativeai pydantic

    - name: Execute Autonomous Research Scraper
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        # Call the script file using the inputs passed from GitHub's interface
        python osint_writer_engine.py --query "${{ github.event.inputs.target }}" --provider "${{ github.event.inputs.provider }}" --export-json

    - name: Commit and Push Intel Artifacts
      run: |
        git config --global user.name "OSINT Engine Bot"
        git config --global user.email "actions@github.com"
        git add output/latest_briefing.json
        git commit -m "data: compiled automated briefing update for target [${{ github.event.inputs.target }}]" || exit 0
        git push origin main
