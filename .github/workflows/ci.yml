services:
  - type: web
    name: osint-research-factory
    env: python
    buildCommand: "pip install -r requirements.txt"
    # ── CRITICAL FIX: Explicitly call python here ───────────────────────
    startCommand: "python app.py"
    # ────────────────────────────────────────────────────────────────────
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false
